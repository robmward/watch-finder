<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bezel First — a watch finder that never asks about brand</title>
<style>
/* ============================================================
   TOKENS — steel bench palette, lume accent, radium secondary
   ============================================================ */
:root{
  --ground:#E9EBED;        /* cool blue-biased paper */
  --panel:#FFFFFF;
  --panel-2:#F2F4F6;
  --hair:#D1D7DD;
  --hair-strong:#B4BDC6;
  --ink:#15191D;
  --ink-2:#4A535C;
  --ink-3:#7C8792;
  --lume:#6F8F1E;          /* lume, darkened for legibility on paper */
  --lume-fill:#C2E06B;     /* lume as a fill / plot colour */
  --lume-soft:#EDF5D6;
  --radium:#9A6420;        /* old-radium amber, text weight */
  --radium-fill:#C98B3C;
  --shadow:0 1px 2px rgba(21,25,29,.06), 0 8px 24px rgba(21,25,29,.07);
  --shadow-lift:0 2px 4px rgba(21,25,29,.08), 0 18px 44px rgba(21,25,29,.13);

  --display:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Arial Narrow",Helvetica,Arial,sans-serif;
  --body:Charter,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --step--1:0.78rem;
  --step-0:0.95rem;
  --step-1:1.15rem;
  --step-2:1.5rem;
  --step-3:2.1rem;
  --step-4:3rem;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#14181C;
    --panel:#1B2126;
    --panel-2:#222A30;
    --hair:#2C333B;
    --hair-strong:#3C454E;
    --ink:#E4E8EB;
    --ink-2:#AEB7C0;
    --ink-3:#7E8891;
    --lume:#C2E06B;
    --lume-fill:#C2E06B;
    --lume-soft:#2A3320;
    --radium:#D9A05A;
    --radium-fill:#C98B3C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#14181C; --panel:#1B2126; --panel-2:#222A30; --hair:#2C333B; --hair-strong:#3C454E;
  --ink:#E4E8EB; --ink-2:#AEB7C0; --ink-3:#7E8891;
  --lume:#C2E06B; --lume-fill:#C2E06B; --lume-soft:#2A3320;
  --radium:#D9A05A; --radium-fill:#C98B3C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 22px 50px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --ground:#E9EBED; --panel:#FFFFFF; --panel-2:#F2F4F6; --hair:#D1D7DD; --hair-strong:#B4BDC6;
  --ink:#15191D; --ink-2:#4A535C; --ink-3:#7C8792;
  --lume:#6F8F1E; --lume-fill:#C2E06B; --lume-soft:#EDF5D6;
  --radium:#9A6420; --radium-fill:#C98B3C;
  --shadow:0 1px 2px rgba(21,25,29,.06), 0 8px 24px rgba(21,25,29,.07);
  --shadow-lift:0 2px 4px rgba(21,25,29,.08), 0 18px 44px rgba(21,25,29,.13);
}

*{box-sizing:border-box;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:var(--step-0); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
button{font:inherit; color:inherit;}

.label{
  font-family:var(--mono); font-size:0.68rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums;}

/* ============================================================
   MASTHEAD
   ============================================================ */
.masthead{
  border-bottom:1px solid var(--hair);
  background:var(--panel);
}
.masthead-in{
  max-width:1240px; margin:0 auto; padding:18px 24px;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
}
.wordmark{
  font-family:var(--display); font-size:var(--step-2); font-weight:700;
  letter-spacing:.06em; text-transform:uppercase; margin:0; line-height:1;
}
.wordmark em{font-style:normal; color:var(--lume);}
.tagline{
  font-family:var(--mono); font-size:var(--step--1); color:var(--ink-3);
  margin:0; flex:1 1 320px; line-height:1.4;
}
.theme-toggle{
  margin-left:auto; background:none; border:1px solid var(--hair-strong);
  border-radius:2px; padding:5px 10px; cursor:pointer;
  font-family:var(--mono); font-size:.68rem; letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-2);
}
.theme-toggle:hover{border-color:var(--lume); color:var(--lume);}

/* ============================================================
   SHELL — spec rail + question stage
   ============================================================ */
.shell{
  max-width:1240px; margin:0 auto; padding:28px 24px 80px;
  display:grid; grid-template-columns:260px 1fr; gap:40px; align-items:start;
}
@media (max-width:940px){
  .shell{grid-template-columns:1fr; gap:24px;}
}

/* ---------- spec rail ---------- */
.rail{position:sticky; top:24px;}
@media (max-width:940px){.rail{position:static;}}
.rail-head{
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:1px solid var(--hair-strong); padding-bottom:8px; margin-bottom:4px;
}
.rail-title{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.1em;
  font-size:var(--step-0); font-weight:700; margin:0;
}
.rail-count{font-family:var(--mono); font-size:.7rem; color:var(--ink-3);}
.rail-list{list-style:none; margin:0; padding:0;}
.rail-row{
  display:flex; align-items:baseline; gap:6px;
  padding:7px 0; border-bottom:1px dotted var(--hair);
  font-family:var(--mono); font-size:.72rem;
}
.rail-row .k{letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;}
.rail-row .lead{
  flex:1; border-bottom:1px dotted var(--hair-strong);
  transform:translateY(-3px); min-width:8px; opacity:.65;
}
.rail-row .v{color:var(--ink-3); text-align:right;}
.rail-row.set .k{color:var(--ink-2);}
.rail-row.set .v{color:var(--lume);}
.rail-row.active{background:var(--panel-2);}
.rail-row.active .k{color:var(--ink);}
.rail-note{
  font-family:var(--mono); font-size:.66rem; color:var(--ink-3);
  line-height:1.5; margin-top:14px; padding-top:12px; border-top:1px solid var(--hair);
}

/* ---------- stage ---------- */
.stage{min-width:0;}
.q-head{margin-bottom:22px;}
.q-step{
  font-family:var(--mono); font-size:.7rem; letter-spacing:.16em;
  color:var(--radium); display:block; margin-bottom:8px;
}
.q-title{
  font-family:var(--display); font-size:var(--step-3); font-weight:700;
  line-height:1.05; letter-spacing:.01em; text-wrap:balance; margin:0 0 10px;
}
.q-kicker{
  margin:0; color:var(--ink-2); max-width:62ch; font-size:var(--step-0);
}
.progress{
  height:2px; background:var(--hair); margin:0 0 24px; position:relative; overflow:hidden;
}
.progress i{
  position:absolute; inset:0 auto 0 0; background:var(--lume-fill);
  transition:width .45s cubic-bezier(.3,.8,.3,1);
}

/* ---------- option plates ---------- */
.opts{
  display:grid; gap:14px;
  grid-template-columns:repeat(auto-fill, minmax(258px,1fr));
}
.opts.chips{grid-template-columns:repeat(auto-fill, minmax(236px,1fr));}
.opt{
  background:var(--panel); border:1px solid var(--hair); border-radius:3px;
  padding:0; text-align:left; cursor:pointer; overflow:hidden;
  display:flex; flex-direction:column;
  transition:border-color .16s, transform .16s, box-shadow .16s;
}
.opt:hover{border-color:var(--hair-strong); transform:translateY(-2px); box-shadow:var(--shadow-lift);}
.opt:focus-visible{outline:2px solid var(--lume); outline-offset:2px;}
.opt.sel{border-color:var(--lume); box-shadow:0 0 0 1px var(--lume);}
.opt-shot{
  position:relative; aspect-ratio:5/4; background:var(--panel-2);
  border-bottom:1px solid var(--hair); overflow:hidden;
}
/* frames are stacked; only .on is visible, so they cross-fade in place */
.opt-shot img{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .7s ease;
}
.opt-shot img.on{opacity:1;}
.opt-shot.missing img{display:none;}
.opt-shot .dots{
  position:absolute; left:9px; bottom:8px; display:flex; gap:4px; z-index:2;
}
.opt-shot .dots i{
  width:5px; height:5px; border-radius:50%; display:block;
  background:rgba(255,255,255,.45); box-shadow:0 0 0 1px rgba(0,0,0,.25);
  transition:background .3s;
}
.opt-shot .dots i.on{background:var(--lume-fill);}
.opt-shot .slot{
  display:none; position:absolute; inset:0; padding:12px;
  flex-direction:column; justify-content:flex-end; gap:4px;
  background:
    repeating-linear-gradient(135deg, transparent 0 9px, var(--hair) 9px 10px),
    var(--panel-2);
}
.opt-shot.missing .slot{display:flex;}
.slot-file{
  font-family:var(--mono); font-size:.6rem; color:var(--ink-2);
  background:var(--panel); border:1px solid var(--hair); border-radius:2px;
  padding:3px 5px; align-self:flex-start; word-break:break-all; max-width:100%;
}
.slot-tag{
  font-family:var(--mono); font-size:.56rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); align-self:flex-start;
  background:var(--panel); padding:2px 5px; border-radius:2px;
}
.opt-body{padding:11px 13px 13px;}
.opt-name{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.055em;
  font-weight:700; font-size:var(--step-0); line-height:1.15; margin:0 0 4px;
}
.opt-sub{margin:0; font-size:.83rem; line-height:1.45; color:var(--ink-2);}
.opt.chip .opt-body{padding:15px 16px;}
.opt-skip{
  border-style:dashed; background:none;
  display:flex; align-items:center; min-height:140px;
}
.opt-skip .opt-body{padding:16px 18px;}
.opt-skip .opt-name{color:var(--ink-2);}

/* ---------- nav ---------- */
.nav{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  margin-top:26px; padding-top:18px; border-top:1px solid var(--hair);
}
.btn{
  background:none; border:1px solid var(--hair-strong); border-radius:2px;
  padding:9px 16px; cursor:pointer; font-family:var(--mono);
  font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-2);
  transition:border-color .16s, color .16s, background .16s;
}
.btn:hover{border-color:var(--lume); color:var(--lume);}
.btn:focus-visible{outline:2px solid var(--lume); outline-offset:2px;}
.btn[disabled]{opacity:.35; cursor:not-allowed;}
.btn[disabled]:hover{border-color:var(--hair-strong); color:var(--ink-2);}
.btn-skip{border-style:dashed;}
.btn-primary{
  border-color:var(--lume); color:var(--lume); background:var(--lume-soft);
}
.nav-note{font-family:var(--mono); font-size:.66rem; color:var(--ink-3); margin-left:auto;}

/* ============================================================
   RESULTS — catalog plate
   ============================================================ */
.result-head{margin-bottom:26px;}
.verdict{
  font-family:var(--display); font-size:var(--step-4); font-weight:700;
  line-height:.98; letter-spacing:.01em; margin:4px 0 12px; text-wrap:balance;
}
.verdict small{display:block; font-size:var(--step-1); color:var(--ink-3); letter-spacing:.04em; margin-bottom:6px;}

.plate{
  background:var(--panel); border:1px solid var(--hair); border-radius:3px;
  box-shadow:var(--shadow); overflow:hidden; margin-bottom:34px;
}
.plate-grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);}
@media (max-width:820px){.plate-grid{grid-template-columns:1fr;}}
.plate-shot{
  position:relative; aspect-ratio:1/1; background:var(--panel-2);
  border-right:1px solid var(--hair);
}
@media (max-width:820px){.plate-shot{border-right:none; border-bottom:1px solid var(--hair); aspect-ratio:4/3;}}
.plate-shot img{width:100%; height:100%; object-fit:cover;}
.plate-shot.missing img{display:none;}
.plate-shot .slot{
  display:none; position:absolute; inset:0; padding:20px;
  flex-direction:column; justify-content:flex-end; gap:6px;
  background:
    repeating-linear-gradient(135deg, transparent 0 11px, var(--hair) 11px 12px),
    var(--panel-2);
}
.plate-shot.missing .slot{display:flex;}
.plate-info{padding:26px 28px 28px; min-width:0;}
.plate-brand{
  font-family:var(--mono); font-size:.72rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--radium); margin:0 0 6px;
}
.plate-name{
  font-family:var(--display); font-size:var(--step-2); font-weight:700;
  text-transform:uppercase; letter-spacing:.03em; line-height:1.1; margin:0 0 4px;
}
.plate-price{
  font-family:var(--mono); font-size:var(--step-1); font-variant-numeric:tabular-nums;
  margin:10px 0 18px; color:var(--ink);
}
.plate-price span{font-size:.64rem; letter-spacing:.1em; color:var(--ink-3); display:block; text-transform:uppercase;}
.plate-why{margin:0 0 20px; font-size:var(--step-0); line-height:1.65; color:var(--ink-2);}
.plate-why strong{color:var(--ink); font-weight:600;}
.specs{list-style:none; margin:0; padding:0; border-top:1px solid var(--hair);}
.specs li{
  display:flex; gap:8px; align-items:baseline; padding:7px 0;
  border-bottom:1px dotted var(--hair); font-family:var(--mono); font-size:.72rem;
}
.specs .k{letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap;}
.specs .lead{flex:1; border-bottom:1px dotted var(--hair-strong); transform:translateY(-3px); opacity:.6;}
.specs .v{text-align:right; color:var(--ink);}
.match-hits{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 18px; padding:0; list-style:none;}
.hit{
  font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase;
  border:1px solid var(--lume); color:var(--lume); background:var(--lume-soft);
  border-radius:2px; padding:3px 7px;
}

/* ---------- the money ladder ---------- */
.ladder-head{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  border-bottom:1px solid var(--hair-strong); padding-bottom:9px; margin-bottom:18px;
}
.ladder-head h2{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em;
  font-size:var(--step-1); font-weight:700; margin:0;
}
.ladder-head p{margin:0; font-family:var(--mono); font-size:.66rem; color:var(--ink-3);}
.ladder{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:34px;}
@media (max-width:700px){.ladder{grid-template-columns:1fr;}}
.rung{
  background:var(--panel); border:1px solid var(--hair); border-radius:3px;
  overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.rung-flag{
  font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase;
  padding:8px 14px; border-bottom:1px solid var(--hair);
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
}
.rung.down .rung-flag{color:var(--lume); background:var(--lume-soft);}
.rung.up .rung-flag{color:var(--radium); background:color-mix(in srgb, var(--radium-fill) 12%, transparent);}
.rung-delta{font-variant-numeric:tabular-nums; opacity:.8;}
.rung-shot{position:relative; aspect-ratio:16/10; background:var(--panel-2); border-bottom:1px solid var(--hair);}
.rung-shot img{width:100%; height:100%; object-fit:cover;}
.rung-shot.missing img{display:none;}
.rung-shot .slot{
  display:none; position:absolute; inset:0; padding:14px;
  flex-direction:column; justify-content:flex-end; gap:5px;
  background:repeating-linear-gradient(135deg, transparent 0 9px, var(--hair) 9px 10px), var(--panel-2);
}
.rung-shot.missing .slot{display:flex;}
.rung-body{padding:16px 18px 18px;}
.rung-brand{font-family:var(--mono); font-size:.64rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); margin:0 0 4px;}
.rung-name{font-family:var(--display); font-size:var(--step-1); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin:0 0 7px; line-height:1.15;}
.rung-price{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:var(--step-0); margin:0 0 10px;}
.rung-why{margin:0; font-size:.86rem; line-height:1.55; color:var(--ink-2);}
.rung-trade{
  margin:12px 0 0; padding-top:11px; border-top:1px dotted var(--hair);
  font-family:var(--mono); font-size:.66rem; line-height:1.5; color:var(--ink-3);
}
.rung-trade b{color:var(--ink-2); font-weight:400; letter-spacing:.1em; text-transform:uppercase;}

/* ---------- runners up ---------- */
.runners{list-style:none; margin:0 0 30px; padding:0; border-top:1px solid var(--hair);}
.runners li{border-bottom:1px dotted var(--hair);}
.runners .runner-go{
  display:grid; grid-template-columns:34px 68px 1fr auto; gap:14px; align-items:center;
  width:100%; padding:10px 4px; background:none; border:none; cursor:pointer;
  text-align:left; border-radius:3px; transition:background .15s;
}
.runners .runner-go:hover{background:var(--panel-2);}
.runner-thumb{
  width:68px; height:52px; object-fit:cover; border-radius:2px;
  border:1px solid var(--hair); background:var(--panel-2);
}
.runners .rank{font-family:var(--mono); font-size:.7rem; color:var(--ink-3);}
.runners .who{min-width:0;}
.runners .runner-go:hover b{color:var(--lume);}
.runners .runner-go:focus-visible{outline:2px solid var(--lume); outline-offset:3px;}
.rung-go{margin-top:14px; width:100%;}
.runners .who b{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;
  font-weight:700; font-size:var(--step-0); display:block;
}
.runners .who span{font-family:var(--mono); font-size:.66rem; color:var(--ink-3);}
.runners .amt{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:.8rem;}

.footnote{
  font-family:var(--mono); font-size:.66rem; line-height:1.7; color:var(--ink-3);
  border-top:1px solid var(--hair); padding-top:16px; max-width:76ch;
}
.footnote b{color:var(--ink-2); letter-spacing:.1em; text-transform:uppercase; font-weight:400;}

/* ---------- where to buy ---------- */
.buy{
  background:var(--panel); border:1px solid var(--hair); border-radius:3px;
  padding:22px 24px 24px; margin-bottom:34px;
}
.buy-route{
  margin:0 0 18px; color:var(--ink-2); font-size:var(--step-0);
  max-width:66ch; line-height:1.6;
}
.buy-zip{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding-bottom:20px; border-bottom:1px dotted var(--hair);
}
.buy-zip label{
  font-family:var(--mono); font-size:.66rem; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-3);
}
.buy-zip input{
  font-family:var(--mono); font-size:var(--step-0); font-variant-numeric:tabular-nums;
  letter-spacing:.12em; width:7.5em; padding:8px 10px; color:var(--ink);
  background:var(--panel-2); border:1px solid var(--hair-strong); border-radius:2px;
}
.buy-zip input:focus-visible{outline:2px solid var(--lume); outline-offset:1px; border-color:var(--lume);}
.buy-err{font-family:var(--mono); font-size:.68rem; color:var(--radium);}
.buy-group{padding:18px 0 0; border-bottom:1px dotted var(--hair);}
.buy-group:last-child{border-bottom:none; padding-bottom:0;}
.buy-group h3{
  font-family:var(--display); text-transform:uppercase; letter-spacing:.08em;
  font-size:var(--step-0); font-weight:700; margin:0 0 4px;
}
.buy-group p{margin:0 0 11px; font-size:.86rem; color:var(--ink-2); max-width:62ch;}
.buy-links{display:flex; flex-wrap:wrap; gap:8px;}
.buy-links .btn{text-decoration:none;}

/* ---------- photo credits ---------- */
.credits{
  margin-top:20px; border-top:1px solid var(--hair); padding-top:14px;
  font-family:var(--mono); font-size:.66rem; color:var(--ink-3);
}
.credits summary{cursor:pointer; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2);}
.credits summary:hover{color:var(--lume);}
.credits ul{
  list-style:none; margin:14px 0 0; padding:0;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:5px 20px;
}
.credits li{line-height:1.5; border-bottom:1px dotted var(--hair); padding:4px 0;}
.credits a{color:var(--ink-2);}
.credits a:hover{color:var(--lume);}
.credits span{color:var(--radium);}

.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-in">
    <h1 class="wordmark">Bezel <em>First</em></h1>
    <p class="tagline">A men's watch finder that asks what you like, not who made it.<br />Brand is optional. Price is last.</p>
    <button class="theme-toggle" id="themeBtn" type="button">Theme</button>
  </div>
</header>

<main class="shell">

  <!-- ===================== SPEC RAIL ===================== -->
  <aside class="rail" aria-label="Your spec sheet">
    <div class="rail-head">
      <h2 class="rail-title">Your spec</h2>
      <span class="rail-count num" id="railCount">0 / 11</span>
    </div>
    <ul class="rail-list" id="railList"></ul>
    <p class="rail-note">Every line is skippable. A blank line means “no preference” and simply stops filtering.</p>
  </aside>

  <!-- ===================== STAGE ===================== -->
  <section class="stage" id="stage">
    <div class="progress"><i id="progBar" style="width:0%"></i></div>
    <div class="q-head">
      <span class="q-step num" id="qStep">Step 01 / 11</span>
      <h2 class="q-title" id="qTitle">—</h2>
      <p class="q-kicker" id="qKicker">—</p>
    </div>
    <div class="opts" id="opts"></div>
    <div class="nav">
      <button class="btn" id="backBtn" type="button">← Back</button>
      <button class="btn btn-skip" id="skipBtn" type="button">No preference</button>
      <button class="btn btn-primary" id="nextBtn" type="button">Next →</button>
      <span class="nav-note" id="navNote"></span>
    </div>
  </section>

  <!-- ===================== RESULTS ===================== -->
  <section class="stage hidden" id="results"></section>

</main>

<script src="data.js"></script>
<script src="buy.js"></script>
<script>
"use strict";

/* ==================================================================
   IMAGE SLOTS
   Every photo this page wants lives in ./images/ under the exact
   filename below. Drop a file in, reload, it appears. Until then the
   slot renders a hatched placeholder printing its own filename.
   See IMAGES.md for the full shot list.
   ================================================================== */
const IMG_DIR = "images/";

/* Accepts one filename or several. With several, the extra frames are stacked
   and cross-faded by rotateShots() so an option like "Blue" can show the colour
   on more than one watch — no single photo represents a colour fairly. */
function shot(cls, files, tag, alt){
  const list = Array.isArray(files) ? files : [files];
  const base = cls.split(" ")[0];
  const imgs = list.map((f, i) => `
    <img src="${IMG_DIR}${f}" alt="${i === 0 ? alt.replace(/"/g,"&quot;") : ""}"
         class="${i === 0 ? "on" : ""}" loading="lazy" decoding="async"
         onerror="this.closest('.${base}').classList.add('missing')" />`).join("");
  return `<div class="${cls}${list.length > 1 ? " rotates" : ""}" data-frames="${list.length}">
    ${imgs}
    <div class="slot" aria-hidden="true">
      <span class="slot-tag">${tag}</span>
      <span class="slot-file">${IMG_DIR}${list[0]}</span>
    </div>
    ${list.length > 1 ? `<div class="dots" aria-hidden="true">${
      list.map((_,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>` : ""}
  </div>`;
}

/* Cross-fade the stacked frames. Staggered so the grid doesn't pulse in unison,
   and skipped entirely when the viewer asked for reduced motion. */
let rotTimers = [];
function stopShots(){ rotTimers.forEach(clearInterval); rotTimers = []; }
function rotateShots(root){
  stopShots();
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  root.querySelectorAll(".rotates").forEach((box, n) => {
    const frames = [...box.querySelectorAll("img")];
    const dots   = [...box.querySelectorAll(".dots i")];
    if(frames.length < 2) return;
    let i = 0;
    const tick = () => {
      frames[i].classList.remove("on"); if(dots[i]) dots[i].classList.remove("on");
      i = (i + 1) % frames.length;
      frames[i].classList.add("on");    if(dots[i]) dots[i].classList.add("on");
    };
    setTimeout(() => { tick(); rotTimers.push(setInterval(tick, 4160)); }, 1170 + n * 546);
  });
}

/* ==================================================================
   ENGINE
   ================================================================== */
const SIZE_ORDER = ["s","m","l","xl"];
const answers = {};
let idx = 0;

const el = {
  railList:document.getElementById("railList"),
  railCount:document.getElementById("railCount"),
  qStep:document.getElementById("qStep"),
  qTitle:document.getElementById("qTitle"),
  qKicker:document.getElementById("qKicker"),
  opts:document.getElementById("opts"),
  prog:document.getElementById("progBar"),
  back:document.getElementById("backBtn"),
  skip:document.getElementById("skipBtn"),
  next:document.getElementById("nextBtn"),
  note:document.getElementById("navNote"),
  stage:document.getElementById("stage"),
  results:document.getElementById("results")
};

const pad = n => String(n).padStart(2,"0");
const money = n => "$" + n.toLocaleString("en-US");
function labelFor(step, v){
  if(v === undefined) return "";
  if(v === null) return "any";
  const o = step.options.find(o => o.v === v);
  return o ? o.label : String(v);
}

/* ---------- spec rail ---------- */
function renderRail(){
  el.railList.innerHTML = STEPS.map((s,i) => {
    const has = Object.prototype.hasOwnProperty.call(answers, s.id);
    const val = has ? (answers[s.id] === null ? "— any —" : labelFor(s, answers[s.id])) : "";
    const cls = ["rail-row", has && answers[s.id] !== null ? "set" : "", i === idx ? "active" : ""].join(" ").trim();
    return `<li class="${cls}"><span class="k">${s.rail}</span><span class="lead"></span><span class="v">${val}</span></li>`;
  }).join("");
  const done = STEPS.filter(s => Object.prototype.hasOwnProperty.call(answers, s.id)).length;
  el.railCount.textContent = `${done} / ${STEPS.length}`;
}

/* ---------- question ---------- */
function renderStep(){
  const s = STEPS[idx];
  el.qStep.textContent = `Step ${pad(idx+1)} / ${pad(STEPS.length)}`;
  el.qTitle.textContent = s.title;
  el.qKicker.textContent = s.kicker;
  el.prog.style.width = (idx / STEPS.length * 100) + "%";
  el.opts.className = "opts" + (s.type === "chip" ? " chips" : "");

  el.opts.innerHTML = s.options.map(o => {
    const sel = answers[s.id] === o.v ? " sel" : "";
    const pic = s.type === "image"
      ? shot("opt-shot", o.imgs || o.img, s.rail, `${o.label} — ${s.rail.toLowerCase()} option`)
      : "";
    return `<button type="button" class="opt${s.type === "chip" ? " chip" : ""}${sel}" data-v="${o.v}">
      ${pic}
      <span class="opt-body">
        <span class="opt-name">${o.label}</span>
        <span class="opt-sub">${o.sub}</span>
      </span>
    </button>`;
  }).join("");

  /* An explicit way out, in the grid where the eye already is. Steps that
     already carry their own "any" answer don't need a second one, and the
     budget step has to be answered. */
  const hasAny = s.options.some(o => o.v === "any");
  if(!s.last && !hasAny){
    const sel = Object.prototype.hasOwnProperty.call(answers, s.id) && answers[s.id] === null ? " sel" : "";
    el.opts.insertAdjacentHTML("beforeend", `
      <button type="button" class="opt opt-skip${sel}" data-v="__skip">
        <span class="opt-body">
          <span class="opt-name">Not sure / don't mind</span>
          <span class="opt-sub">Skip this one. It stops filtering rather than guessing on your behalf, and you can come back to it.</span>
        </span>
      </button>`);
  }

  el.opts.querySelectorAll(".opt").forEach(b => {
    b.addEventListener("click", () => {
      answers[s.id] = b.dataset.v === "__skip" ? null : b.dataset.v;
      renderRail();
      el.opts.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      el.note.textContent = "";
      setTimeout(advance, 170);
    });
  });

  rotateShots(el.opts);

  el.back.disabled = idx === 0;
  el.next.textContent = s.last ? "Show me the watch →" : "Next →";
  el.skip.classList.toggle("hidden", !!s.last);
  el.note.textContent = "";
  renderRail();
  window.scrollTo({top:0, behavior:"smooth"});
}

function advance(){
  if(idx < STEPS.length - 1){ idx++; renderStep(); }
  else { finish(); }
}

el.back.addEventListener("click", () => { if(idx > 0){ idx--; renderStep(); } });
el.skip.addEventListener("click", () => { answers[STEPS[idx].id] = null; renderRail(); advance(); });
el.next.addEventListener("click", () => {
  const s = STEPS[idx];
  if(!Object.prototype.hasOwnProperty.call(answers, s.id)){
    if(s.last){ el.note.textContent = "Pick a budget to finish."; return; }
    answers[s.id] = null;
  }
  renderRail(); advance();
});

/* ---------- scoring ---------- */
function score(w){
  let pts = 0;
  const hits = [];

  const a = answers;
  // hard filters on movement
  if(a.mv === "mech" && !(w.mv === "auto" || w.mv === "hand")) return null;
  if(a.mv === "digital" && w.mv !== "digital") return null;

  function hit(key, weight, val, tag){
    // "any" is the explicit no-preference sentinel — it must not filter or score
    if(!a[key] || a[key] === "any") return;
    const match = Array.isArray(val) ? val.includes(a[key]) : val === a[key];
    if(match){ pts += weight; hits.push(tag); }
  }

  hit("vb", 3,  w.vb, "purpose");
  hit("sh", 2.5, w.sh, "case shape");
  hit("bz", 3,  w.bz, "bezel");
  hit("dc", 2,  w.dc, "dial colour");
  hit("ly", 2,  w.ly, "layout");
  hit("ix", 2,  w.ix, "markers");
  hit("st", 2,  w.st, "bracelet");
  hit("bt", 1,  w.bt, "brand lean");

  if(a.sz){
    const d = Math.abs(SIZE_ORDER.indexOf(a.sz) - SIZE_ORDER.indexOf(w.sz));
    if(d === 0){ pts += 2; hits.push("size"); }
    else if(d === 1){ pts += 1; }
  }
  if(a.mv === "mech" && (w.mv === "auto" || w.mv === "hand")){ pts += 3; hits.push("mechanical"); }
  if(a.mv === "lowmaint"){
    if(w.mv === "solar"){ pts += 3; hits.push("solar"); }
    else if(w.mv === "quartz" || w.mv === "digital"){ pts += 2.5; hits.push("no winding"); }
  }
  if(a.mv === "digital" && w.mv === "digital"){ pts += 3; hits.push("digital"); }

  return {w, pts, hits};
}

function rank(pool){
  return pool.map(score).filter(Boolean)
    .sort((x,y) => y.pts - x.pts || x.w.p - y.w.p);
}

/* ---------- results ---------- */
function finish(){
  const br = BRACKETS[answers.price];
  const scored = rank(WATCHES);

  const inBand = scored.filter(r => r.w.p >= br.min && r.w.p <= br.max);
  const main   = inBand[0] || scored[0];

  // Rungs: best taste-match that costs less / more than the chosen bracket.
  // Tie-break toward the budget, so an equal-scoring pick doesn't plunge
  // to the cheapest thing on the list when something nearer money also fits.
  const below = scored.filter(r => r.w.p < br.min)
                      .sort((x,y) => y.pts - x.pts || y.w.p - x.w.p);
  const above = scored.filter(r => r.w.p > br.max)
                      .sort((x,y) => y.pts - x.pts || x.w.p - y.w.p);

  // At the floor or ceiling bracket there is nothing outside the band, so step
  // within it instead of claiming the list has ended.
  const inBelow = inBand.filter(r => r.w.p < main.w.p)
                        .sort((x,y) => y.pts - x.pts || y.w.p - x.w.p);
  const inAbove = inBand.filter(r => r.w.p > main.w.p)
                        .sort((x,y) => y.pts - x.pts || x.w.p - y.w.p);

  const down = below[0] || inBelow[0] || null;
  const up   = above[0] || inAbove[0] || null;

  // Distinguish "no cheaper watch exists" from "your filters removed them all",
  // so the empty-rung copy never tells the user something untrue.
  const filtered = {
    down: !down && WATCHES.some(w => w.p < main.w.p),
    up:   !up   && WATCHES.some(w => w.p > main.w.p)
  };

  const maxPts = main.pts || 1;
  const statedHits = [...new Set(main.hits)];

  const specRows = STEPS.filter(s => !s.last && answers[s.id])
    .map(s => `<li><span class="k">${s.rail}</span><span class="lead"></span><span class="v">${labelFor(s, answers[s.id])}</span></li>`)
    .join("");

  function plate(r){
    const w = r.w;
    return `<div class="plate">
      <div class="plate-grid">
        ${shot("plate-shot", "watch-" + w.s + ".jpg", "Hero shot", w.b + " " + w.n)}
        <div class="plate-info">
          <p class="plate-brand">${w.b}</p>
          <h3 class="plate-name">${w.n}</h3>
          <p class="plate-price">${money(w.p)}<span>approx. street price</span></p>
          <ul class="match-hits">${statedHits.map(h => `<li class="hit">${h} ✓</li>`).join("")}</ul>
          <p class="plate-why">${w.w}</p>
          <ul class="specs">
            ${w.sp.map((v,i) => `<li><span class="k">${["Case","Water","Movement"][i] || "Note"}</span><span class="lead"></span><span class="v">${v}</span></li>`).join("")}
          </ul>
        </div>
      </div>
    </div>`;
  }

  function rung(r, dir){
    if(!r){
      let msg;
      if(filtered[dir]){
        msg = dir === "down"
          ? "There are cheaper watches here, but none of them clear the movement you asked for. Loosen that answer and a lower rung appears."
          : "There are dearer watches here, but none of them match the movement you asked for — which is its own kind of answer about value.";
      } else {
        msg = dir === "down"
          ? "Nothing on this list costs less. You are already at the floor, where watches stop being disposable."
          : "You are at the top of this list. Above here you are buying rarity and a sales experience, not more watch.";
      }
      return `<div class="rung ${dir}">
        <div class="rung-flag"><span>${dir === "down" ? "One step cheaper" : "One step dearer"}</span></div>
        <div class="rung-body"><p class="rung-why">${msg}</p></div>
      </div>`;
    }
    const w = r.w;
    const delta = w.p - main.w.p;
    const pct = Math.round(r.pts / maxPts * 100);
    return `<div class="rung ${dir}">
      <div class="rung-flag">
        <span>${dir === "down" ? "One step cheaper" : "One step dearer"}</span>
        <span class="rung-delta">${delta > 0 ? "+" : "−"}${money(Math.abs(delta))}</span>
      </div>
      ${shot("rung-shot", "watch-" + w.s + ".jpg", "Alternate", w.b + " " + w.n)}
      <div class="rung-body">
        <p class="rung-brand">${w.b}</p>
        <h3 class="rung-name">${w.n}</h3>
        <p class="rung-price">${money(w.p)}</p>
        <p class="rung-why">${w.w}</p>
        <p class="rung-trade"><b>Fit to your spec</b> &nbsp;${pct}% of the match above · ${w.sp[0]} · ${w.sp[w.sp.length-1]}</p>
        <button type="button" class="btn btn-primary rung-go" data-slug="${w.s}">
          See this watch &amp; where to buy →
        </button>
      </div>
    </div>`;
  }

  const runners = inBand.slice(1, 6);

  el.results.innerHTML = `
    <div class="result-head">
      <span class="q-step num">Result · ${br.label} · scored against ${scored.length} watches</span>
      <h2 class="verdict"><small>Built from your spec sheet, not from a logo:</small>${main.w.b} ${main.w.n}</h2>
    </div>

    ${plate(main)}

    <div class="ladder-head">
      <h2>The rung below and the rung above</h2>
      <p>Same taste profile, different money</p>
    </div>
    <div class="ladder">
      ${rung(down,"down")}
      ${rung(up,"up")}
    </div>

    ${runners.length ? `
    <div class="ladder-head">
      <h2>Also in your bracket</h2>
      <p>Next closest matches at ${br.label}</p>
    </div>
    <ul class="runners">
      ${runners.map((r,i) => `<li>
        <button type="button" class="runner-go" data-slug="${r.w.s}">
          <span class="rank">${pad(i+2)}</span>
          <img class="runner-thumb" src="${IMG_DIR}watch-${r.w.s}.jpg" alt="" loading="lazy" decoding="async" />
          <span class="who"><b>${r.w.b} ${r.w.n}</b><span>${r.w.sp.join(" · ")}</span></span>
          <span class="amt">${money(r.w.p)}</span>
        </button>
      </li>`).join("")}
    </ul>` : ""}

    <div id="buyMount"></div>

    <div class="ladder-head">
      <h2>Your spec sheet</h2>
      <p>What the recommendation was built from</p>
    </div>
    <ul class="specs" style="margin-bottom:30px">${specRows || '<li><span class="k">No preferences set</span><span class="lead"></span><span class="v">ranked on budget alone</span></li>'}</ul>

    <div class="nav">
      <button class="btn btn-primary" id="againBtn" type="button">Start over</button>
      <button class="btn" id="editBtn" type="button">← Change an answer</button>
    </div>

    <p class="footnote" style="margin-top:34px">
      <b>On the prices</b> — figures are approximate US street or retail prices and move with exchange rates, model year and dealer. Treat them as brackets, not quotes.<br />
      <b>On availability</b> — a few of the steel sports models at the top of the list sell above retail on the secondary market, sometimes substantially. The number shown is list price, which is not always the price you can pay.<br />
      <b>On brand</b> — this page never asked who made anything until question ten, and that question defaults to “don't care.” The names only appear here, after the taste is already settled.
    </p>

    <details class="credits">
      <summary>Photo credits — ${CREDITS.length} images, all reused under open licences</summary>
      <ul>
        ${CREDITS.map(c => `<li><a href="${c.page}" target="_blank" rel="noopener">${c.title}</a> — ${c.author} — <span>${c.license}</span></li>`).join("")}
      </ul>
    </details>`;

  el.stage.classList.add("hidden");
  el.results.classList.remove("hidden");
  el.prog.style.width = "100%";
  renderRail();
  window.scrollTo({top:0, behavior:"smooth"});

  lastMain = main.w;
  renderBuy(main.w, document.getElementById("buyMount"));

  /* Keep the finished results so a detour into a watch's own page can come
     straight back to them without re-running the quiz. */
  resultsHTML = el.results.innerHTML;

  wireResults();
}

/* Re-attachable because the results markup is restored wholesale after a
   detail view, which destroys the previous listeners. */
let resultsHTML = "";
let lastMain = null;

function wireResults(){
  const again = document.getElementById("againBtn");
  if(again) again.addEventListener("click", () => {
    STEPS.forEach(s => delete answers[s.id]);
    idx = 0;
    el.results.classList.add("hidden");
    el.stage.classList.remove("hidden");
    renderStep();
  });
  const edit = document.getElementById("editBtn");
  if(edit) edit.addEventListener("click", () => {
    idx = 0;                       // back to the first question, not the budget
    el.results.classList.add("hidden");
    el.stage.classList.remove("hidden");
    renderStep();
  });
  el.results.querySelectorAll(".rung-go, .runner-go").forEach(b => {
    b.addEventListener("click", () => showDetail(b.dataset.slug));
  });
  const buyMount = document.getElementById("buyMount");
  if(buyMount && lastMain) renderBuy(lastMain, buyMount);
}

/* ---------- a watch's own page ---------- */
function showDetail(slug){
  const w = WATCHES.find(x => x.s === slug);
  if(!w) return;
  const inYourBracket = BRACKETS[answers.price];
  const rel = inYourBracket
    ? (w.p > inYourBracket.max ? "above" : w.p < inYourBracket.min ? "below" : "within")
    : "within";
  const relCopy = {
    above: `This sits above the ${inYourBracket && inYourBracket.label} you picked. What the extra money buys is below.`,
    below: `This sits below the ${inYourBracket && inYourBracket.label} you picked — the argument for spending less.`,
    within:`This is inside the ${inYourBracket && inYourBracket.label} you picked.`
  }[rel];

  el.results.innerHTML = `
    <div class="nav" style="margin:0 0 24px; padding:0; border:none">
      <button class="btn" id="backToResults" type="button">← Back to your match</button>
    </div>
    <div class="result-head">
      <span class="q-step num">${w.b}</span>
      <h2 class="verdict"><small>${relCopy}</small>${w.n}</h2>
    </div>
    <div class="plate">
      <div class="plate-grid">
        ${shot("plate-shot", "watch-" + w.s + ".jpg", "Hero shot", w.b + " " + w.n)}
        <div class="plate-info">
          <p class="plate-price">${money(w.p)}<span>approx. street price</span></p>
          <p class="plate-why">${w.w}</p>
          <ul class="specs">
            ${w.sp.map(v => `<li><span class="k">Spec</span><span class="lead"></span><span class="v">${v}</span></li>`).join("")}
            <li><span class="k">Case</span><span class="lead"></span><span class="v">${
              {s:"34–37 mm",m:"37–39.5 mm",l:"40–42 mm",xl:"42 mm +"}[w.sz]} · ${w.sh}</span></li>
            <li><span class="k">Dial</span><span class="lead"></span><span class="v">${w.dc} · ${w.ly} · ${w.ix}</span></li>
            <li><span class="k">Bezel</span><span class="lead"></span><span class="v">${w.bz}</span></li>
            <li><span class="k">Worn on</span><span class="lead"></span><span class="v">${w.st.join(", ")}</span></li>
            <li><span class="k">Movement</span><span class="lead"></span><span class="v">${w.mv}</span></li>
          </ul>
        </div>
      </div>
    </div>
    <div id="buyMount"></div>`;

  renderBuy(w, document.getElementById("buyMount"));
  document.getElementById("backToResults").addEventListener("click", () => {
    el.results.innerHTML = resultsHTML;
    wireResults();
    window.scrollTo({top:0, behavior:"smooth"});
  });
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- theme ---------- */
document.getElementById("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const now = cur ? cur : (sysDark ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", now === "dark" ? "light" : "dark");
});

renderStep();
</script>
</body>
</html>
